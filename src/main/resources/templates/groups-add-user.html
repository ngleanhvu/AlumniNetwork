<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Manage Group</title>
  <th:block th:replace="base :: styles"></th:block>
</head>
<body>
<div th:replace="base :: header"></div>

<section class="container py-4">

  <h2 class="text-center fw-bold font-monospace mb-4">Thêm thành viên</h2>
  <form method="post" th:action="@{/groups/admin/add-user}" th:object="${group}">
    <input type="hidden" th:field="*{id}">

    <!-- Nhập tên nhóm -->
    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="name" placeholder="Tên nhóm" th:field="*{name}">
      <label for="name">Tên nhóm</label>
      <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
    </div>

    <!-- Danh sách người dùng để thêm -->
    <div class="mb-3">
      <label for="users" class="form-label fw-semibold">Chọn thành viên</label>
      <select class="form-select" id="users" name="userIds" multiple size="5">
        <option th:each="u : ${users}"
                th:value="${u.id}"
                th:text="${u.username}"
                th:selected="${existingUserIds.contains(u.id)}">
        </option>
      </select>
    </div>

    <!-- Nút submit -->
    <div class="mt-3">
      <button type="submit" class="btn btn-success">Thêm thành viên</button>
    </div>
  </form>
</section>

<div th:replace="base :: footer"></div>
</body>
</html>
