<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Manage Group</title>
  <th:block th:replace="base :: styles"></th:block>
</head>
<body>
<div th:replace="base :: header"></div>

<section class="container py-4">

  <h2 class="text-center fw-bold font-monospace mb-4">Quản lý nhóm</h2>

  <div class="alert alert-info" role="alert"
       th:if="${msg != null}"
       th:text="${msg}">
  </div>

  <form th:action="@{/groups/admin}" method="get" class="mb-4">
    <div class="row g-2">
      <div class="col-md-6">
        <input type="text" class="form-control" name="groupName" placeholder="Từ khóa" />
      </div>
      <div class="col-md-3">
        <button class="btn btn-info w-100" type="submit">Tìm kiếm</button>
      </div>
      <div class="col-md-3 text-md-end">
        <a th:href="@{/groups/admin/save}" class="btn btn-success w-100">Thêm nhóm</a>
      </div>
    </div>
  </form>

  <hr />

  <table class="table table-bordered table-hover text-center">
    <thead class="table-dark">
    <tr>
      <th scope="col">Tên nhóm</th>
      <th scope="col">Tác vụ</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="g : ${groups}">
      <td th:text="${g.name}"></td>
      <td>
        <form method="post" th:action="@{'/groups/admin/delete'}" th:object="${g}" class="d-inline">
          <input type="hidden" name="id" th:value="${g.id}" />
          <button class="btn btn-danger btn-sm m-1" type="submit" onclick="return confirm('Bạn có chắc muốn xoá nhóm này không?');">Xoá</button>
        </form>
        <button class="btn btn-danger btn-sm m-1" type="button">
          <a th:href="@{'/groups/admin/add-user/'+${g.id}}" class="text-white">Thêm thành viên</a>
        </button>
        <button class="btn btn-danger btn-sm m-1" type="button">
          <a th:href="@{'/groups/admin/group-user/'+${g.id}}" class="text-white">Xem thành viên nhóm</a>
        </button>
      </td>
    </tr>
    </tbody>
  </table>

</section>

<div th:replace="base :: footer"></div>
</body>
</html>
