<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Post Statistics</title>
    <th:block th:replace="~{base :: styles}"></th:block>
</head>
<body>
<div th:replace="~{base :: header}"></div>

<section class="container">
    <form th:action="@{/posts/admin/statistics}" method="post" class="row g-3 align-items-end mt-3 mb-4">
        <!-- Chọn loại thời gian: Tháng / Quý -->
        <div class="col-md-4">
            <label for="timeType" class="form-label">Chọn thời gian</label>
            <select name="timeType" id="timeType" class="form-select">
                <option value="MONTH" th:selected="${selectedTimeType == 'MONTH'}">Tháng</option>
                <option value="QUARTER" th:selected="${selectedTimeType == 'QUARTER'}">Quý</option>
            </select>
        </div>

        <!-- Nhập năm -->
        <div class="col-md-4">
            <label for="year" class="form-label">Năm</label>
            <input type="number" name="year" id="year" min="2020"
                   th:value="${selectedYear != null ? selectedYear : 2025}"
                   class="form-control" required>
        </div>

        <!-- Nút submit -->
        <div class="col-md-4">
            <button type="submit" class="btn btn-success w-100">
                <i class="bi bi-bar-chart-fill me-1"></i> Thống kê
            </button>
        </div>
    </form>

    <!-- Thông báo khi không có dữ liệu -->
    <div th:if="${stats.isEmpty()}">
        <p>Không có bài viết nào trong <span th:text="${timeType == 'MONTH' ? 'tháng' : 'quý'}"></span> năm <span th:text="${year != null ? year : 'N/A'}"></span>.</p>
    </div>

    <!-- Biểu đồ khi có dữ liệu -->
    <div th:unless="${stats.isEmpty()}" id="post_stats_google_chart" style="width: 100%; height: 400px;"></div>

    <!-- Google Charts -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript" th:inline="javascript">
        google.charts.load('current', {packages: ['corechart', 'bar']});
        document.addEventListener('DOMContentLoaded', function () {
            google.charts.setOnLoadCallback(drawChart);
        });

        function drawChart() {
            try {
                // Lấy dữ liệu từ Thymeleaf
                var timeType = /*[[${timeType}]]*/ 'MONTH';
                var year = /*[[${year}]]*/ 2025;
                var stats = /*[[${stats}]]*/ [];

                if (!year || year === null) {
                    document.getElementById('post_stats_google_chart').innerHTML = '<p>Lỗi: Năm không hợp lệ.</p>';
                    return;
                }

                // Kiểm tra nếu stats rỗng
                if (!stats || stats.length === 0) {
                    document.getElementById('post_stats_google_chart').innerHTML = '<p>Không có dữ liệu để hiển thị biểu đồ.</p>';
                    return;
                }

                // Chuẩn bị dữ liệu cho biểu đồ
                var dataArray = [
                    [(timeType === 'MONTH' ? 'Tháng' : 'Quý'), 'Số bài viết']
                ];
                var maxUnits = (timeType === 'MONTH') ? 12 : 4;
                var unitData = {};

                // Khởi tạo giá trị 0
                for (var i = 1; i <= maxUnits; i++) {
                    unitData[i] = 0;
                }

                // Cập nhật dữ liệu thực tế
                for (var i = 0; i < stats.length; i++) {
                    var key = Number(stats[i][0]); // Ép kiểu tháng/quý
                    var value = Number(stats[i][1]); // Ép kiểu số bài viết
                    if (key >= 1 && key <= maxUnits) {
                        unitData[key] = value;
                    }
                }

                // Tạo mảng cho Google Charts
                for (var i = 1; i <= maxUnits; i++) {
                    var label = (timeType === 'MONTH') ? 'Tháng ' + i : 'Quý ' + i;
                    dataArray.push([label, unitData[i]]);
                }

                console.log("dataArray:", dataArray); // Debug

                // Tạo biểu đồ
                var data = google.visualization.arrayToDataTable(dataArray);
                var options = {
                    title: 'Thống kê bài viết theo ' + (timeType === 'MONTH' ? 'tháng' : 'quý') + ' năm ' + year,
                    hAxis: {title: (timeType === 'MONTH' ? 'Tháng' : 'Quý')},
                    vAxis: {title: 'Số bài viết'},
                    legend: 'none',
                    colors: ['#4285F4']
                };

                var chart = new google.visualization.ColumnChart(document.getElementById('post_stats_google_chart'));
                chart.draw(data, options);
            } catch (e) {
                console.error("Lỗi khi vẽ biểu đồ:", e);
                document.getElementById('post_stats_google_chart').innerHTML = '<p>Lỗi khi hiển thị biểu đồ: ' + e.message + '</p>';
            }
        }
    </script>
</section>
<div th:replace="~{base :: footer}"></div>
</body>
</html>
